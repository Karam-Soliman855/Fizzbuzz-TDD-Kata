[project]
name = "fizzbuzz-kata"
version = "0.1.0"
description = "A TDD kata: FizzBuzz, from notebook exploration to a tested, published package"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Karam Soliman", email = "karam.soliman.etu@univ-lille.fr" }
]
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fizzbuzz_kata"]

[dependency-groups]
dev = [
    "marimo>=0.24.2",
    "pytest>=9.1.1",
    "pytest-cov>=5.0",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*.py" = ["B018", "PLR1711"]